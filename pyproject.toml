[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-qwen-decision"
version = "0.1.0"
description = "Non-generative Qwen decision model for CityFlow traffic-signal control"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
dependencies = [
  "torch==2.14.1", "unsloth==2026.10.2", "transformers==5.17.0",
  "datasets==4.8.5", "accelerate==1.15.0", "peft==0.21.2",
  "bitsandbytes==0.50.2", "numpy==2.2.6", "pandas==2.3.3",
  "matplotlib==3.10.9", "laya==0.3.29",
  "cityflow @ git+https://github.com/cityflow-project/CityFlow.git@81ee0f47659ca66177a71f81676691c58ee89184"
]

[tool.setuptools.packages.find]
include = ["traffic_qwen*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"